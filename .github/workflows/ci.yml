name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: retention_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retention_test

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retention_test
          STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_fake_secret_for_ci
          RESEND_API_KEY: re_fake_key_for_ci
          RESEND_AUDIENCE_ID: aud_fake_id_for_ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retention_test
          STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_fake_secret_for_ci
          RESEND_API_KEY: re_fake_key_for_ci
          RESEND_AUDIENCE_ID: aud_fake_id_for_ci
